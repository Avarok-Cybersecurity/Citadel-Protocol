name: Build docs
on:
  push:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # 40 MiB stack
  RUST_MIN_STACK: 40971520
  RUST_LOG: "citadel=warn"

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true


jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: none
          cache-on-failure: "false"
          targets: ""
          components: ""
          tools: make
      - name: Compile documentation
        run: cargo make docs
      # The site as GitHub Pages serves it from gh-pages: the SDK's pages under docs/ and a root page
      # that redirects there. It is laid out here so that one deploy publishes it, as one commit. It
      # was rearranged after the deploy, on a second checkout of gh-pages over the workspace: two
      # commits and two Pages builds per push, and the setup-rust post step, which reads the
      # action from the workspace, failed every run (45004463334).
      - name: Lay out the published site
        run: |
          mv target/doc/citadel_sdk target/doc/docs
          printf '%s\n' '<meta http-equiv="refresh" content="0; url=docs">' > target/doc/index.html
      - name: Deploy documentation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: target/doc
          target_branch: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#      - uses: katyo/publish-crates@v1
#        with:
#          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
