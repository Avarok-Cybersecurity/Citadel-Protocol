  wasm_check:
    name: WASM Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SDK_WASM_TESTS: wasm_basic_p2p wasm_crypto wasm_backend wasm_browser_connection_split
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      # The crates below citadel_proto are clippy-clean on wasm32; citadel_proto, citadel_sdk
      # and citadel_media still carry wasm-only warnings (unused native imports and the like),
      # so they join this list once those are cleared.
      - name: Clippy for wasm32
        run: cargo clippy --target wasm32-unknown-unknown --no-deps -p citadel_io -p citadel_types -p citadel_logging -p citadel_pqcrypto -p citadel_crypt -p citadel_treekem -p citadel_user -p netbeam -p async_ip -p citadel_wire -- -D warnings
      - name: Check citadel_pqcrypto for wasm32
        run: cargo check --package citadel_pqcrypto --target wasm32-unknown-unknown --no-default-features
      - name: Check citadel_sdk for wasm32
        run: cargo check --package citadel_sdk --target wasm32-unknown-unknown
      - name: No classical signature crate in the wasm32 server graph
        run: ci/no-classical-signatures.sh
      - name: No WASI crate, fork or cfg; one crates.io tokio on wasm32
        run: ci/no-wasi.sh
      - name: Check citadel_media for wasm32
        run: cargo check --package citadel_media --target wasm32-unknown-unknown
      - name: Check the browser security-key backend
        run: cargo check --package citadel_sdk --target wasm32-unknown-unknown --no-default-features --features security-key --test wasm_security_key
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Run WASM integration tests
        working-directory: citadel_sdk
        run: wasm-pack test --node --release -- --no-default-features $(printf -- '--test %s ' $SDK_WASM_TESTS)
      # Cargo, not a path guess, names the artifacts: the build-dir layout moved test binaries
      # out of deps/. The same flags as wasm-pack's cargo call keep this a no-op rebuild.
      - name: The wasm32 test artifacts import only wasm-bindgen host functions
        working-directory: citadel_sdk
        run: |
          cargo test --target wasm32-unknown-unknown --release --no-default-features $(printf -- '--test %s ' $SDK_WASM_TESTS) --no-run --message-format=json > "$RUNNER_TEMP/sdk-wasm-tests.json"
          artifacts=$(python3 ../ci/wasm-test-executables.py "$RUNNER_TEMP/sdk-wasm-tests.json" $SDK_WASM_TESTS)
          mapfile -t paths <<< "$artifacts"
          python3 ../ci/wasm-imports-are-bindgen-only.py "${paths[@]}"
      - name: Run citadel_media WASM tests
        working-directory: citadel_media
        run: wasm-pack test --node --release -- --test wasm_media

  typescript_types:
    name: TypeScript Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The published sources must be what citadel_types generates. Before this,
      # nothing regenerated them: the exporter itself had stopped compiling, and
      # KemAlgorithm.ts lacked two variants the Rust has.
      - uses: Avarok-Cybersecurity/gh-actions-deps@master
      - name: Generated types match the Rust
        run: bash ci/check-ts-types-fresh.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: citadel-protocol-types-ts
        run: npm ci

      - name: Build TypeScript
        working-directory: citadel-protocol-types-ts
        run: npm run build

      - name: Run tests
        working-directory: citadel-protocol-types-ts
        run: npm test

  coverage:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --component llvm-tools-preview
      - uses: taiki-e/install-action@nextest
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
        continue-on-error: true  # Don't fail if cache service is unavailable
      - name: Run llvm-cov nextest
        env:
          SKIP_EXT_BACKENDS: "true"
        run: cargo llvm-cov nextest --features=filesystem,localhost-testing,multi-threaded -p citadel_sdk -p citadel_user -p citadel_crypt -p citadel_pqcrypto -p citadel_wire -p netbeam -p async_ip -p citadel_treekem -p citadel_types -p citadel_io --lcov --output-path ${GITHUB_WORKSPACE}/lcov.info --ignore-filename-regex="firebase-rtdb/src/lib.rs|netbeam/src/sync/operations/net_join.rs|netbeam/src/sync/operations/net_select.rs|citadel_sdk/src/test_common.rs|citadel_wire/src/standard/upnp_handler.rs"
      - uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.GITHUB_WORKSPACE }}/lcov.info
  docker_nat_client_server:
    runs-on: ubuntu-latest
    strategy:
      # One flaky leg must not cancel its siblings — each leg is an independent OS/NAT-pair
      # with no cross-leg dependency, and cancelling destroys which leg actually failed.
      fail-fast: false
      matrix:
        nat_type_client_a:
          - "full_cone"
          - "address_restricted"
          - "port_restricted"
          - "symmetric"
    timeout-minutes: 60
    env:
      NAT_TYPE_CLIENT_A: ${{ matrix.nat_type_client_a }}
    steps:
      - uses: actions/checkout@v4
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@main
      - run: docker compose -f ./docker/client_server.yml up --abort-on-container-exit --exit-code-from client_a
  docker_nat_p2p:
    runs-on: ubuntu-latest
    strategy:
      # One flaky leg must not cancel its siblings — each leg is an independent OS/NAT-pair
      # with no cross-leg dependency, and cancelling destroys which leg actually failed.
      fail-fast: false
      matrix:
        nat_type_peer_a:
          - "full_cone"
          - "address_restricted"
          - "port_restricted"
          - "symmetric"
        nat_type_peer_b:
          - "full_cone"
          - "address_restricted"
          - "port_restricted"
          - "symmetric"
    timeout-minutes: 60
    env:
      NAT_TYPE_PEER_A: ${{ matrix.nat_type_peer_a }}
      NAT_TYPE_PEER_B: ${{ matrix.nat_type_peer_b }}
    steps:
      - uses: actions/checkout@v4
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@main
      - if: ${{ ! (matrix.nat_type_peer_a == 'symmetric' && matrix.nat_type_peer_b == 'symmetric') }}
        run: docker compose -f ./docker/peer_to_peer.yml up --abort-on-container-exit --exit-code-from peer_a
        shell: bash
  docker_wasm_p2p:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@main
      - run: docker compose -f ./docker/wasm_p2p.yml up --build --abort-on-container-exit --exit-code-from wasm_tests
