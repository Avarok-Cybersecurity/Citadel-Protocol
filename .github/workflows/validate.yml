name: Validate PR
on:
  workflow_call:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # 40 MiB stack
  RUST_MIN_STACK: 40971520
  RUST_LOG: "citadel=info"
  IN_CI: "true"

jobs:
  stability-test:
    name: Ratchet Stability Test
    runs-on: macos-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup dependencies
        id: deps
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 2, wait 15s)
        if: steps.deps.outcome == 'failure'
        run: sleep 15
      - name: Setup dependencies (retry 2)
        if: steps.deps.outcome == 'failure'
        id: deps-retry-2
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 3, wait 30s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure'
        run: sleep 30
      - name: Setup dependencies (retry 3)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure'
        id: deps-retry-3
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 4, wait 60s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure'
        run: sleep 60
      - name: Setup dependencies (retry 4)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure'
        id: deps-retry-4
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 5, wait 60s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure' && steps.deps-retry-4.outcome == 'failure'
        run: sleep 60
      - name: Setup dependencies (retry 5)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure' && steps.deps-retry-4.outcome == 'failure'
        id: deps-retry-5
        uses: Avarok-Cybersecurity/gh-actions-deps@master
      - uses: taiki-e/install-action@nextest
      - name: Run ratchet stability test
        # Non-blocking: This test catches race conditions that are timing-dependent.
        # On slow CI runners, it may fail due to increased contention.
        # Results are logged for analysis but don't block the pipeline.
        continue-on-error: true
        run: cargo make ratchet-stability-test
  core_libs:
    strategy:
      # One flaky leg must not cancel its siblings — each leg is an independent OS/NAT-pair
      # with no cross-leg dependency, and cancelling destroys which leg actually failed.
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    steps:
      - name: Setup MySQL
        id: mysql
        if: startsWith(matrix.os, 'ubuntu')
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: '8.0'
          root-password: 'password'
        continue-on-error: true
      - name: Retry MySQL (attempt 2, wait 15s)
        if: startsWith(matrix.os, 'ubuntu') && steps.mysql.outcome == 'failure'
        run: sleep 15
      - name: Setup MySQL (retry 2)
        id: mysql-retry-2
        if: startsWith(matrix.os, 'ubuntu') && steps.mysql.outcome == 'failure'
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: '8.0'
          root-password: 'password'
        continue-on-error: true
      - name: Retry MySQL (attempt 3, wait 30s)
        if: startsWith(matrix.os, 'ubuntu') && steps.mysql.outcome == 'failure' && steps.mysql-retry-2.outcome == 'failure'
        run: sleep 30
      - name: Setup MySQL (retry 3)
        id: mysql-retry-3
        if: startsWith(matrix.os, 'ubuntu') && steps.mysql.outcome == 'failure' && steps.mysql-retry-2.outcome == 'failure'
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: '8.0'
          root-password: 'password'
      - name: Setup Postgres database (1)
        if: startsWith(matrix.os, 'ubuntu')
        uses: Daniel-Marynicz/postgresql-action@master
        with:
          postgres_image_tag: latest
          app_user: nologik
          app_user_password: password
          app_db: hyxewave hyxewave2
      - name: Add mysql databases
        if: startsWith(matrix.os, 'ubuntu')
        run: mysql -uroot -h127.0.0.1 -ppassword -e 'CREATE DATABASE hyxewave; CREATE DATABASE hyxewave2; set global max_connections = 1000;'
      - name: Augment connection size for psql
        if: startsWith(matrix.os, 'ubuntu')
        run: psql -c 'ALTER SYSTEM SET max_connections TO 1000' postgresql://postgres:postgres@localhost/hyxewave && psql -c 'ALTER SYSTEM SET max_connections TO 1000' postgresql://postgres:postgres@localhost/hyxewave2
      - name: Add sqlite databases
        if: startsWith(matrix.os, 'ubuntu')
        run: touch /home/runner/hyxewave.db && touch /home/runner/hyxewave2.db
      - name: Start Redis
        if: startsWith(matrix.os, 'ubuntu')
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: 7
          redis-port: 6379
      - name: Setup dependencies
        id: deps
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 2, wait 15s)
        if: steps.deps.outcome == 'failure'
        run: sleep 15
      - name: Setup dependencies (retry 2)
        if: steps.deps.outcome == 'failure'
        id: deps-retry-2
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 3, wait 30s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure'
        run: sleep 30
      - name: Setup dependencies (retry 3)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure'
        id: deps-retry-3
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 4, wait 60s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure'
        run: sleep 60
      - name: Setup dependencies (retry 4)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure'
        id: deps-retry-4
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 5, wait 60s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure' && steps.deps-retry-4.outcome == 'failure'
        run: sleep 60
      - name: Setup dependencies (retry 5)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure' && steps.deps-retry-4.outcome == 'failure'
        id: deps-retry-5
        uses: Avarok-Cybersecurity/gh-actions-deps@master
      - uses: taiki-e/install-action@nextest
      - name: Run crypto tests
        run: cargo nextest run --package citadel_pqcrypto --package citadel_crypt
      - name: Run holistic user library + SQL backend
        if: startsWith(matrix.os, 'ubuntu')
        env:
          TESTING_SQL_SERVER_ADDR_SERVER: "mysql://root:password@localhost/hyxewave,postgres://nologik:password@localhost/hyxewave,sqlite:/home/runner/hyxewave.db,redis://127.0.0.1:6379/1"
          TESTING_SQL_SERVER_ADDR_CLIENT: "mysql://root:password@localhost/hyxewave2,postgres://nologik:password@localhost/hyxewave2,sqlite:/home/runner/hyxewave2.db,redis://127.0.0.1:6379/2"
        run: cargo nextest run --package citadel_user --features sql,redis
      - name: Run minimal user library + SQL backend
        if: startsWith(matrix.os, 'windows') || startsWith(matrix.os, 'macos')
        env:
          SKIP_EXT_BACKENDS: "true"
        run: cargo nextest run --package citadel_user --features localhost-testing
      - run: cargo nextest run --features=localhost-testing,multi-threaded --package citadel_proto
        if: ${{ !startsWith(matrix.os, 'windows') }}
      - run: cargo nextest run --features=localhost-testing,multi-threaded,vendored --package citadel_proto
        if: ${{ startsWith(matrix.os, 'windows') }}
      # Single-threaded builds spawn with spawn_local inside a LocalSet; this leg is the only
      # place citadel_proto's own tests run that way.
      - name: citadel_proto single-threaded
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: cargo nextest run --features=localhost-testing --package citadel_proto
      - name: citadel_proto single-threaded (windows only)
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: cargo nextest run --features=localhost-testing,vendored --package citadel_proto

  nat:
    strategy:
      # One flaky leg must not cancel its siblings — each leg is an independent OS/NAT-pair
      # with no cross-leg dependency, and cancelling destroys which leg actually failed.
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Setup dependencies
        id: deps
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 2, wait 15s)
        if: steps.deps.outcome == 'failure'
        run: sleep 15
      - name: Setup dependencies (retry 2)
        if: steps.deps.outcome == 'failure'
        id: deps-retry-2
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 3, wait 30s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure'
        run: sleep 30
      - name: Setup dependencies (retry 3)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure'
        id: deps-retry-3
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 4, wait 60s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure'
        run: sleep 60
      - name: Setup dependencies (retry 4)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure'
        id: deps-retry-4
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 5, wait 60s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure' && steps.deps-retry-4.outcome == 'failure'
        run: sleep 60
      - name: Setup dependencies (retry 5)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure' && steps.deps-retry-4.outcome == 'failure'
        id: deps-retry-5
        uses: Avarok-Cybersecurity/gh-actions-deps@master
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --package netbeam
      # --release: the UDP-traversal timing tests (esp. the high-lag consensus regression) are
      # calibrated against fixed timeouts; a debug build's slowness widens the lag/barrier
      # windows enough that shared-runner scheduler jitter tips a boundary-calibrated attempt
      # over its deadline. Release removes that confounder (mirrors the citadel_sdk_release job).
      - name: Run basic localhost NAT tests
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: cargo nextest run --release --package citadel_wire --features=localhost-testing
      - name: Run basic localhost NAT tests (windows only)
        if: startsWith(matrix.os, 'windows')
        run: cargo nextest run --release --package citadel_wire --features=localhost-testing,vendored
      # The whole crate again, built as production builds it: localhost-testing short-circuits
      # NatType::identify and the loopback bind, so identification failing (or succeeding)
      # inside a hole punch, and every other cfg-gated path, is only exercised without it.
      # Tests that need the localhost NAT model are compiled only with the feature.
      - name: Run citadel_wire without localhost-testing
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: cargo nextest run --release --package citadel_wire
      - name: Run citadel_wire without localhost-testing (windows only)
        if: startsWith(matrix.os, 'windows')
        run: cargo nextest run --release --package citadel_wire --features=vendored

  citadel_sdk:
    strategy:
      # One flaky leg must not cancel its siblings — each leg is an independent OS/NAT-pair
      # with no cross-leg dependency, and cancelling destroys which leg actually failed.
      fail-fast: false
      # One job per (OS, thread model), as citadel_sdk_release does. Both nextest passes in one
      # job took 56 of 65 min on macOS at master (run 43621433190: 27 + 26) and ran out on
      # #389 (run 44263624976: single-threaded 255/255 green in 30 min, multi-threaded cut off
      # at 32). Each pass compiles its own test binaries, so splitting halves each job's work.
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        threading: [ single-threaded, multi-threaded ]
        include:
          - threading: single-threaded
            features: localhost-testing
          - threading: multi-threaded
            features: multi-threaded,localhost-testing
    name: citadel_sdk (${{ matrix.os }}, ${{ matrix.threading }})
    runs-on: ${{ matrix.os }}
    # CI capacity budget, not a test timeout (the tests' own bounds are unchanged). Windows'
    # budget was sized for two passes (each compiles ~25 min, run 36785646666); a job now runs
    # one, and neither budget is changed.
    timeout-minutes: ${{ startsWith(matrix.os, 'windows') && 110 || 65 }}
    steps:
      - name: Setup dependencies
        id: deps
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 2, wait 15s)
        if: steps.deps.outcome == 'failure'
        run: sleep 15
      - name: Setup dependencies (retry 2)
        if: steps.deps.outcome == 'failure'
        id: deps-retry-2
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 3, wait 30s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure'
        run: sleep 30
      - name: Setup dependencies (retry 3)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure'
        id: deps-retry-3
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 4, wait 60s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure'
        run: sleep 60
      - name: Setup dependencies (retry 4)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure'
        id: deps-retry-4
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 5, wait 60s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure' && steps.deps-retry-4.outcome == 'failure'
        run: sleep 60
      - name: Setup dependencies (retry 5)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure' && steps.deps-retry-4.outcome == 'failure'
        id: deps-retry-5
        uses: Avarok-Cybersecurity/gh-actions-deps@master
      - uses: taiki-e/install-action@nextest
      - name: Cache media test fixtures
        uses: actions/cache@v4
        with:
          path: target/media_fixtures
          key: media-fixtures-b3726eac-be112703
      - name: ${{ matrix.threading }} testing
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: cargo nextest run --package citadel_sdk --features=${{ matrix.features }}
      - name: ${{ matrix.threading }} testing (windows only)
        if: startsWith(matrix.os, 'windows')
        run: cargo nextest run --package citadel_sdk --features=${{ matrix.features }},vendored

  io_uring:
    # Linux-only: validates the opt-in io_uring inbound-UDP backend. Compile-checks both thread models
    # with the feature on, then runs the UDP-exercising stress tests. If the runner sandbox blocks
    # io_uring_setup(2), the backend falls back to the standard tokio path, so these still pass — the
    # job then asserts "no regression with the feature enabled" rather than io_uring-specific behavior.
    name: io_uring UDP backend (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Setup dependencies
        id: deps
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 2, wait 15s)
        if: steps.deps.outcome == 'failure'
        run: sleep 15
      - name: Setup dependencies (retry 2)
        if: steps.deps.outcome == 'failure'
        id: deps-retry-2
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 3, wait 30s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure'
        run: sleep 30
      - name: Setup dependencies (retry 3)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure'
        id: deps-retry-3
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 4, wait 60s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure'
        run: sleep 60
      - name: Setup dependencies (retry 4)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure'
        id: deps-retry-4
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 5, wait 60s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure' && steps.deps-retry-4.outcome == 'failure'
        run: sleep 60
      - name: Setup dependencies (retry 5)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure' && steps.deps-retry-4.outcome == 'failure'
        id: deps-retry-5
        uses: Avarok-Cybersecurity/gh-actions-deps@master
      - uses: taiki-e/install-action@nextest
      - name: Build with io_uring (single-threaded)
        run: cargo build --package citadel_sdk --features=localhost-testing,io-uring
      - name: Build with io_uring (multi-threaded)
        run: cargo build --package citadel_sdk --features=multi-threaded,localhost-testing,io-uring
      - name: UDP stress tests with io_uring
        run: cargo nextest run --package citadel_sdk --features=multi-threaded,localhost-testing,io-uring -E 'test(stress_test_c2s_messaging) | test(stress_test_p2p_messaging)'

  security_key:
    # The opt-in security-key backends, which no other job builds. The native one compiles on each
    # OS, so its platform code (Windows elevation, Linux udev) is checked, and its tests run our key
    # channel and cancellation logic; none needs a key. The browser one is checked in wasm_check.
    name: Security key backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Setup dependencies
        id: deps
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 2, wait 15s)
        if: steps.deps.outcome == 'failure'
        run: sleep 15
      - name: Setup dependencies (retry 2)
        if: steps.deps.outcome == 'failure'
        id: deps-retry-2
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 3, wait 30s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure'
        run: sleep 30
      - name: Setup dependencies (retry 3)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure'
        id: deps-retry-3
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 4, wait 60s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure'
        run: sleep 60
      - name: Setup dependencies (retry 4)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure'
        id: deps-retry-4
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 5, wait 60s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure' && steps.deps-retry-4.outcome == 'failure'
        run: sleep 60
      - name: Setup dependencies (retry 5)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure' && steps.deps-retry-4.outcome == 'failure'
        id: deps-retry-5
        uses: Avarok-Cybersecurity/gh-actions-deps@master
      - name: Install libudev
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update -y && sudo apt-get install -y libudev-dev
      - uses: taiki-e/install-action@nextest
      - name: Security key tests
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: cargo nextest run --package citadel_proto --features=security-key -E 'test(security_key)'
      - name: Security key tests (windows only)
        if: startsWith(matrix.os, 'windows')
        run: cargo nextest run --package citadel_proto --features=security-key,vendored -E 'test(security_key)'
      - name: Build the hardware test
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo check --package citadel_sdk --features=localhost-testing,security-key --test pq_sign_in_security_key

  citadel_sdk_release:
    # One leg per nextest pass, in parallel. Both passes in one job (each compiling its own
    # test binaries, then running) took 1h17m51s on #359 against an 80-minute budget, and
    # #360's was cancelled at 80 minutes mid-way through the second pass with every test so
    # far green. Each leg now compiles and runs one feature set, about half the work, under
    # the same budget; the budget is not raised.
    name: citadel_sdk_release (${{ matrix.threading }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - threading: single-threaded
            features: localhost-testing
          - threading: multi-threaded
            features: multi-threaded,localhost-testing
    runs-on: macos-latest
    timeout-minutes: 80
    # What this job exists to test is release SEMANTICS: debug_assertions off and
    # opt-level 3 (protocol constants once differed by build type; see
    # MAX_RATCHETS_IN_MEMORY). The workspace's shipping profile also asks for fat
    # LTO with one codegen unit, which buys nothing for a test and is paid once per
    # test binary, twice (single- and multi-threaded): at 34 binaries the compile
    # alone took 48 of the 80 minutes and the job timed out with every test green.
    # Overridden here only; the shipped binaries keep the profile in Cargo.toml.
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Setup dependencies
        id: deps
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 2, wait 15s)
        if: steps.deps.outcome == 'failure'
        run: sleep 15
      - name: Setup dependencies (retry 2)
        if: steps.deps.outcome == 'failure'
        id: deps-retry-2
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 3, wait 30s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure'
        run: sleep 30
      - name: Setup dependencies (retry 3)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure'
        id: deps-retry-3
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 4, wait 60s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure'
        run: sleep 60
      - name: Setup dependencies (retry 4)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure'
        id: deps-retry-4
        uses: Avarok-Cybersecurity/gh-actions-deps@master
        continue-on-error: true
      - name: Retry deps (attempt 5, wait 60s)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure' && steps.deps-retry-4.outcome == 'failure'
        run: sleep 60
      - name: Setup dependencies (retry 5)
        if: steps.deps.outcome == 'failure' && steps.deps-retry-2.outcome == 'failure' && steps.deps-retry-3.outcome == 'failure' && steps.deps-retry-4.outcome == 'failure'
        id: deps-retry-5
        uses: Avarok-Cybersecurity/gh-actions-deps@master
      - uses: taiki-e/install-action@nextest
      # Each leg's own cache: the two feature sets build different artifacts, and one shared
      # key would have each leg evict the other's.
      - uses: Swatinem/rust-cache@v2
        with:
          key: citadel-sdk-release-${{ matrix.threading }}
          cache-on-failure: true
        continue-on-error: true  # Don't fail if cache service is unavailable
      - name: ${{ matrix.threading }} testing
        run: cargo nextest run --package citadel_sdk --features=${{ matrix.features }} --release

