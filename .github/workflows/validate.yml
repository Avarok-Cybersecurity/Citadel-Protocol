name: Validate PR
on:
  workflow_call:

# Tier 0 gates everything: tiers 1 and 2 each need only the tier-0 jobs, so they start together
# once tier 0 passes (owner, 2026-11-18), and a formatting slip or a wasm-only warning costs
# minutes, not the hours the OS matrix and coverage take. A job skipped because an earlier tier failed shows as skipped and
# the run as failed; `All checks` at the end fails unless every job it lists succeeded, so it is
# the one name branch protection needs.
#
#   tier 0, lint and static gates (Linux, all parallel): fmt and the CI gates, native clippy,
#     wasm32 clippy and the wasm graph gates, cargo deny + cargo audit, the lockfile age gate,
#     docs, TypeScript types
#   tier 1, core tests (Linux): the crates below citadel_proto, doc tests, the wasm32 tests and the
#     ratchet stability loop
#   tier 2, heavy: citadel_proto and citadel_sdk on every OS, the core crates on macOS and
#     Windows, the release-semantics SDK run, coverage, io_uring, security keys, docker NAT
#
# A pull request's newer push cancels its older run; a run on any other event is never cancelled.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # 40 MiB stack
  RUST_MIN_STACK: 40971520
  RUST_LOG: "citadel=info"
  IN_CI: "true"

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------- tier 0: lint and static gates

  fmt:
    name: fmt and CI gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: none
          targets: ""
          components: rustfmt
          tools: ""
      - run: cargo fmt --check
      - name: Every CI cargo invocation uses the committed lockfile
        run: python3 ci/cargo_locked_gate.py .
      - name: The supply-chain gates' own tests
        run: python3 -m unittest discover -s ci/tests -v

  clippy:
    name: clippy (native)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: t0-clippy-linux
          targets: ""
          components: clippy
          tools: ""
      - run: cargo clippy --locked --features=webrtc,sql,redis,multi-threaded -- -D warnings
      - run: cargo clippy --locked --features=webrtc,sql,redis,multi-threaded --release -- -D warnings
      - run: cargo clippy --locked --features=webrtc,sql,redis -- -D warnings
      - run: cargo clippy --locked --features=webrtc,sql,redis --release -- -D warnings
      - run: cargo clippy --locked --tests --examples -- -D warnings

  wasm_lint:
    name: wasm32 clippy and graph gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: t0-wasm-lint
          targets: wasm32-unknown-unknown
          components: clippy
          tools: ""
      # Clippy is a superset of `cargo check`, so the wasm32 build checks this job once ran
      # (citadel_pqcrypto without default features, citadel_sdk, citadel_media, the browser
      # security-key backend) are the configurations the script lints.
      - name: Clippy for wasm32, warnings denied, every browser feature set
        run: ci/wasm-clippy.sh
      - name: No classical signature crate in the wasm32 server graph
        run: ci/no-classical-signatures.sh
      - name: No WASI crate, fork or cfg; one crates.io tokio on wasm32
        run: ci/no-wasi.sh

  supply_chain:
    name: cargo deny + cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: none
          targets: ""
          components: ""
          tools: deny,audit
      # Both tools fetch the RustSec database before they judge; the cache only spares the clone.
      - name: Date for the advisory database cache
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ steps.day.outputs.day }}
          restore-keys: advisory-db-
      - run: cargo deny --locked check all
      - name: cargo audit (exceptions from deny.toml)
        run: ci/cargo-audit.sh

  lockfile_age:
    name: Lockfile age gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A pull request is judged against its base; a run started by hand, against master.
      BASE: ${{ github.event.pull_request.base.sha || 'master' }}
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the base commit
        run: git fetch --no-tags --depth=1 origin "$BASE"
      # Publish dates never change; the cache spares crates.io a request per entry already seen.
      - uses: actions/cache@v5
        with:
          path: ~/crates-io-published.json
          key: crates-io-published-${{ github.run_id }}
          restore-keys: crates-io-published-
      - run: >-
          python3 ci/lockfile_age_gate.py
          --base-ref FETCH_HEAD
          --allowlist ci/lockfile-age-allowlist.toml
          --min-age-days 14
          --cache ~/crates-io-published.json
          --lockfile Cargo.lock
          --lockfile fuzz/Cargo.lock

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: t0-docs
          targets: ""
          components: ""
          tools: make
      - run: cargo make docs
        env:
          RUSTDOCFLAGS: "-D warnings"

  typescript_types:
    name: TypeScript Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: citadel-protocol-types-ts
        run: npm ci
      - name: Build TypeScript
        working-directory: citadel-protocol-types-ts
        run: npm run build
      - name: Run tests
        working-directory: citadel-protocol-types-ts
        run: npm test

  # ------------------------------------------------------------------------ tier 1: core tests

  core:
    name: core crates (ubuntu-latest)
    needs: [fmt, clippy, wasm_lint, supply_chain, lockfile_age, docs, typescript_types]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Setup MySQL
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: '8.0'
          root-password: 'password'
      - name: Setup Postgres databases
        uses: Daniel-Marynicz/postgresql-action@2.0.0
        with:
          postgres_image_tag: latest
          app_user: nologik
          app_user_password: password
          app_db: hyxewave hyxewave2
      - name: Add mysql databases
        run: mysql -uroot -h127.0.0.1 -ppassword -e 'CREATE DATABASE hyxewave; CREATE DATABASE hyxewave2; set global max_connections = 1000;'
      - name: Augment connection size for psql
        run: psql -c 'ALTER SYSTEM SET max_connections TO 1000' postgresql://postgres:postgres@localhost/hyxewave && psql -c 'ALTER SYSTEM SET max_connections TO 1000' postgresql://postgres:postgres@localhost/hyxewave2
      - name: Add sqlite databases
        run: touch /home/runner/hyxewave.db && touch /home/runner/hyxewave2.db
      - name: Start Redis
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: 7
          redis-port: 6379
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: t1-core-linux
          targets: ""
          components: ""
          tools: nextest
      - name: Crypto tests
        run: cargo nextest run --locked --package citadel_pqcrypto --package citadel_crypt
      - name: Holistic user library + SQL backends
        env:
          TESTING_SQL_SERVER_ADDR_SERVER: "mysql://root:password@localhost/hyxewave,postgres://nologik:password@localhost/hyxewave,sqlite:/home/runner/hyxewave.db,redis://127.0.0.1:6379/1"
          TESTING_SQL_SERVER_ADDR_CLIENT: "mysql://root:password@localhost/hyxewave2,postgres://nologik:password@localhost/hyxewave2,sqlite:/home/runner/hyxewave2.db,redis://127.0.0.1:6379/2"
        run: cargo nextest run --locked --package citadel_user --features sql,redis
      - name: The small crates below citadel_proto
        run: cargo nextest run --locked -p citadel_types -p citadel_io -p citadel_logging -p citadel_treekem -p async_ip -p citadel_negotiation -p citadel_media

  wire:
    name: netbeam + citadel_wire (ubuntu-latest)
    needs: [fmt, clippy, wasm_lint, supply_chain, lockfile_age, docs, typescript_types]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: t1-wire-linux
          targets: ""
          components: ""
          tools: nextest
      - run: cargo nextest run --locked --package netbeam
      # --release: the UDP-traversal timing tests (esp. the high-lag consensus regression) are
      # calibrated against fixed timeouts; a debug build's slowness widens the lag/barrier
      # windows enough that shared-runner scheduler jitter tips a boundary-calibrated attempt
      # over its deadline. Release removes that confounder (mirrors the citadel_sdk_release job).
      - name: Run basic localhost NAT tests
        run: cargo nextest run --locked --release --package citadel_wire --features=localhost-testing
      # The whole crate again, built as production builds it: localhost-testing short-circuits
      # NatType::identify and the loopback bind, so identification failing (or succeeding)
      # inside a hole punch, and every other cfg-gated path, is only exercised without it.
      - name: Run citadel_wire without localhost-testing
        run: cargo nextest run --locked --release --package citadel_wire

  doc_tests:
    name: doc tests
    needs: [fmt, clippy, wasm_lint, supply_chain, lockfile_age, docs, typescript_types]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: t1-doctests-linux
          targets: ""
          components: ""
          tools: ""
      - run: cargo test --locked --doc

  wasm_tests:
    name: WASM tests
    needs: [fmt, clippy, wasm_lint, supply_chain, lockfile_age, docs, typescript_types]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SDK_WASM_TESTS: wasm_basic_p2p wasm_crypto wasm_backend wasm_browser_connection_split
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: t1-wasm-tests
          targets: wasm32-unknown-unknown
          components: ""
          tools: wasm-pack
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run WASM integration tests
        working-directory: citadel_sdk
        run: |
          read -ra tests <<< "$SDK_WASM_TESTS"
          args=(); for t in "${tests[@]}"; do args+=(--test "$t"); done
          wasm-pack test --node --release -- --locked --no-default-features "${args[@]}"
      # Cargo, not a path guess, names the artifacts: the build-dir layout moved test binaries
      # out of deps/. The same flags as wasm-pack's cargo call keep this a no-op rebuild.
      - name: The wasm32 test artifacts import only wasm-bindgen host functions
        working-directory: citadel_sdk
        run: |
          read -ra tests <<< "$SDK_WASM_TESTS"
          args=(); for t in "${tests[@]}"; do args+=(--test "$t"); done
          cargo test --locked --target wasm32-unknown-unknown --release --no-default-features "${args[@]}" --no-run --message-format=json > "$RUNNER_TEMP/sdk-wasm-tests.json"
          artifacts=$(python3 ../ci/wasm-test-executables.py "$RUNNER_TEMP/sdk-wasm-tests.json" "${tests[@]}")
          mapfile -t paths <<< "$artifacts"
          python3 ../ci/wasm-imports-are-bindgen-only.py "${paths[@]}"
      - name: Run citadel_media WASM tests
        working-directory: citadel_media
        run: wasm-pack test --node --release -- --locked --test wasm_media

  stability-test:
    name: Ratchet Stability Test
    needs: [fmt, clippy, wasm_lint, supply_chain, lockfile_age, docs, typescript_types]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: t1-stability-linux
          targets: ""
          components: ""
          tools: nextest,make
      # Blocking. It ran with continue-on-error, so a failure could never turn the run red; the
      # last runs before this change all passed (0 failures in 10 iterations each).
      - run: cargo make ratchet-stability-test

  # ------------------------------------------------------------------------------ tier 2: heavy

  core_os:
    name: core crates (${{ matrix.os }})
    needs: [fmt, clippy, wasm_lint, supply_chain, lockfile_age, docs, typescript_types]
    strategy:
      # One flaky leg must not cancel its siblings — each leg is an independent OS
      # with no cross-leg dependency, and cancelling destroys which leg actually failed.
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VENDORED: ${{ startsWith(matrix.os, 'windows') && ',vendored' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: t2-core-${{ matrix.os }}
          targets: ""
          components: ""
          tools: nextest
      - name: Crypto tests
        run: cargo nextest run --locked --package citadel_pqcrypto --package citadel_crypt
      - name: Minimal user library
        env:
          SKIP_EXT_BACKENDS: "true"
        run: cargo nextest run --locked --package citadel_user --features localhost-testing
      - run: cargo nextest run --locked --package netbeam
      - name: Run basic localhost NAT tests
        run: cargo nextest run --locked --release --package citadel_wire --features="localhost-testing$VENDORED"
      - name: Run citadel_wire without localhost-testing
        run: cargo nextest run --locked --release --package citadel_wire --features="${VENDORED#,}"

  citadel_proto:
    name: citadel_proto (${{ matrix.os }})
    needs: [fmt, clippy, wasm_lint, supply_chain, lockfile_age, docs, typescript_types]
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    env:
      VENDORED: ${{ startsWith(matrix.os, 'windows') && ',vendored' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: t2-proto-${{ matrix.os }}
          targets: ""
          components: ""
          tools: nextest
      - name: citadel_proto multi-threaded
        run: cargo nextest run --locked --features="localhost-testing,multi-threaded$VENDORED" --package citadel_proto
      # Single-threaded builds spawn with spawn_local inside a LocalSet; this leg is the only
      # place citadel_proto's own tests run that way.
      - name: citadel_proto single-threaded
        run: cargo nextest run --locked --features="localhost-testing$VENDORED" --package citadel_proto

  citadel_sdk:
    needs: [fmt, clippy, wasm_lint, supply_chain, lockfile_age, docs, typescript_types]
    strategy:
      # One flaky leg must not cancel its siblings — each leg is an independent OS/thread model
      # with no cross-leg dependency, and cancelling destroys which leg actually failed.
      fail-fast: false
      # One job per (OS, thread model), as citadel_sdk_release does. Both nextest passes in one
      # job took 56 of 65 min on macOS at master (run 43621433190: 27 + 26) and ran out on
      # #389 (run 44263624976: single-threaded 255/255 green in 30 min, multi-threaded cut off
      # at 32). Each pass compiles its own test binaries, so splitting halves each job's work.
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        threading: [ single-threaded, multi-threaded ]
        include:
          - threading: single-threaded
            features: localhost-testing
          - threading: multi-threaded
            features: multi-threaded,localhost-testing
        # The coverage shards run this exact suite on macOS: citadel_sdk with its default
        # features plus localhost-testing and multi-threaded, in a debug build, every test
        # (partitioned three ways). A second macOS multi-threaded run repeated it, 37 minutes of
        # the scarcest runner per pull request.
        exclude:
          - os: macos-latest
            threading: multi-threaded
    name: citadel_sdk (${{ matrix.os }}, ${{ matrix.threading }})
    runs-on: ${{ matrix.os }}
    # CI capacity budget, not a test timeout (the tests' own bounds are unchanged).
    timeout-minutes: ${{ startsWith(matrix.os, 'windows') && 110 || 65 }}
    env:
      VENDORED: ${{ startsWith(matrix.os, 'windows') && ',vendored' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: t2-sdk-${{ matrix.os }}-${{ matrix.threading }}
          targets: ""
          components: ""
          tools: nextest
      - name: Cache media test fixtures
        uses: actions/cache@v5
        with:
          path: target/media_fixtures
          key: media-fixtures-${{ hashFiles('citadel_sdk/tests/common/fixtures.rs') }}
      # The suite reads the media fixtures from disk only (CITADEL_OFFLINE); this step fetches
      # them, so a network failure fails here and never inside a media test (run 44263624976).
      - name: Fetch media test fixtures
        run: cargo nextest run --locked --package citadel_sdk --features="${{ matrix.features }}$VENDORED" --test media_fixtures --run-ignored only
      - name: ${{ matrix.threading }} testing
        env:
          CITADEL_OFFLINE: "1"
        run: cargo nextest run --locked --package citadel_sdk --features="${{ matrix.features }}$VENDORED"

  citadel_sdk_release:
    # One leg per nextest pass, in parallel. Both passes in one job (each compiling its own
    # test binaries, then running) took 1h17m51s on #359 against an 80-minute budget, and
    # #360's was cancelled at 80 minutes mid-way through the second pass with every test so
    # far green. Each leg now compiles and runs one feature set, about half the work, under
    # the same budget; the budget is not raised.
    name: citadel_sdk_release (${{ matrix.threading }})
    needs: [fmt, clippy, wasm_lint, supply_chain, lockfile_age, docs, typescript_types]
    strategy:
      fail-fast: false
      matrix:
        include:
          - threading: single-threaded
            features: localhost-testing
          - threading: multi-threaded
            features: multi-threaded,localhost-testing
    runs-on: macos-latest
    timeout-minutes: 80
    # What this job exists to test is release SEMANTICS: debug_assertions off and
    # opt-level 3 (protocol constants once differed by build type; see
    # MAX_RATCHETS_IN_MEMORY). The workspace's shipping profile also asks for fat
    # LTO with one codegen unit, which buys nothing for a test and is paid once per
    # test binary, twice (single- and multi-threaded): at 34 binaries the compile
    # alone took 48 of the 80 minutes and the job timed out with every test green.
    # Overridden here only; the shipped binaries keep the profile in Cargo.toml.
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v5
      # Each leg's own cache: the two feature sets build different artifacts, and one shared
      # key would have each leg evict the other's.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: t2-sdk-release-${{ matrix.threading }}
          targets: ""
          components: ""
          tools: nextest
      - name: Cache media test fixtures
        uses: actions/cache@v5
        with:
          path: target/media_fixtures
          key: media-fixtures-${{ hashFiles('citadel_sdk/tests/common/fixtures.rs') }}
      # As in the citadel_sdk job: fetched here, read from disk by the suite.
      - name: Fetch media test fixtures
        run: cargo nextest run --locked --package citadel_sdk --features=${{ matrix.features }} --release --test media_fixtures --run-ignored only
      - name: ${{ matrix.threading }} testing
        env:
          CITADEL_OFFLINE: "1"
        run: cargo nextest run --locked --package citadel_sdk --features=${{ matrix.features }} --release

  io_uring:
    # Linux-only: validates the opt-in io_uring inbound-UDP backend. Compile-checks both thread models
    # with the feature on, then runs the UDP-exercising stress tests. If the runner sandbox blocks
    # io_uring_setup(2), the backend falls back to the standard tokio path, so these still pass — the
    # job then asserts "no regression with the feature enabled" rather than io_uring-specific behavior.
    name: io_uring UDP backend (Linux)
    needs: [fmt, clippy, wasm_lint, supply_chain, lockfile_age, docs, typescript_types]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: t2-io-uring-linux
          targets: ""
          components: ""
          tools: nextest
      - name: Build with io_uring (single-threaded)
        run: cargo build --locked --package citadel_sdk --features=localhost-testing,io-uring
      - name: Build with io_uring (multi-threaded)
        run: cargo build --locked --package citadel_sdk --features=multi-threaded,localhost-testing,io-uring
      - name: UDP stress tests with io_uring
        run: cargo nextest run --locked --package citadel_sdk --features=multi-threaded,localhost-testing,io-uring -E 'test(stress_test_c2s_messaging) | test(stress_test_p2p_messaging)'

  security_key:
    # The opt-in security-key backends, which no other job builds. The native one compiles on each
    # OS, so its platform code (Windows elevation, Linux udev) is checked, and its tests run our key
    # channel and cancellation logic; none needs a key. The browser one is linted in wasm_lint.
    name: Security key backend (${{ matrix.os }})
    needs: [fmt, clippy, wasm_lint, supply_chain, lockfile_age, docs, typescript_types]
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      VENDORED: ${{ startsWith(matrix.os, 'windows') && ',vendored' || '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Install libudev
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update -y && sudo apt-get install -y libudev-dev
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: t2-security-key-${{ matrix.os }}
          targets: ""
          components: ""
          tools: nextest
      - name: Security key tests
        run: cargo nextest run --locked --package citadel_proto --features="security-key$VENDORED" -E 'test(security_key)'
      - name: Build the hardware test
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo check --locked --package citadel_sdk --features=localhost-testing,security-key --test pq_sign_in_security_key

  coverage:
    needs: [fmt, clippy, wasm_lint, supply_chain, lockfile_age, docs, typescript_types]
    uses: ./.github/workflows/coverage.yml
    secrets: inherit

  docker_nat_client_server:
    needs: [fmt, clippy, wasm_lint, supply_chain, lockfile_age, docs, typescript_types]
    runs-on: ubuntu-latest
    strategy:
      # One flaky leg must not cancel its siblings — each leg is an independent OS/NAT-pair
      # with no cross-leg dependency, and cancelling destroys which leg actually failed.
      fail-fast: false
      matrix:
        nat_type_client_a:
          - "full_cone"
          - "address_restricted"
          - "port_restricted"
          - "symmetric"
    timeout-minutes: 60
    env:
      NAT_TYPE_CLIENT_A: ${{ matrix.nat_type_client_a }}
    steps:
      - uses: actions/checkout@v5
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v1.3.1
      - run: docker compose -f ./docker/client_server.yml up --abort-on-container-exit --exit-code-from client_a

  docker_nat_p2p:
    needs: [fmt, clippy, wasm_lint, supply_chain, lockfile_age, docs, typescript_types]
    runs-on: ubuntu-latest
    strategy:
      # One flaky leg must not cancel its siblings — each leg is an independent OS/NAT-pair
      # with no cross-leg dependency, and cancelling destroys which leg actually failed.
      fail-fast: false
      matrix:
        nat_type_peer_a:
          - "full_cone"
          - "address_restricted"
          - "port_restricted"
          - "symmetric"
        nat_type_peer_b:
          - "full_cone"
          - "address_restricted"
          - "port_restricted"
          - "symmetric"
        # Two symmetric NATs cannot be traversed without a relay, and the leg's only step was
        # skipped for this pair: it checked out, freed disk and reported green, testing nothing.
        exclude:
          - nat_type_peer_a: "symmetric"
            nat_type_peer_b: "symmetric"
    timeout-minutes: 60
    env:
      NAT_TYPE_PEER_A: ${{ matrix.nat_type_peer_a }}
      NAT_TYPE_PEER_B: ${{ matrix.nat_type_peer_b }}
    steps:
      - uses: actions/checkout@v5
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v1.3.1
      - run: docker compose -f ./docker/peer_to_peer.yml up --abort-on-container-exit --exit-code-from peer_a

  docker_wasm_p2p:
    needs: [fmt, clippy, wasm_lint, supply_chain, lockfile_age, docs, typescript_types]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v1.3.1
      - run: docker compose -f ./docker/wasm_p2p.yml up --build --abort-on-container-exit --exit-code-from wasm_tests

  # ------------------------------------------------------------------------------------ result

  all_checks:
    name: All checks
    if: always()
    needs:
      - fmt
      - clippy
      - wasm_lint
      - supply_chain
      - lockfile_age
      - docs
      - typescript_types
      - core
      - wire
      - doc_tests
      - wasm_tests
      - stability-test
      - core_os
      - citadel_proto
      - citadel_sdk
      - citadel_sdk_release
      - io_uring
      - security_key
      - coverage
      - docker_nat_client_server
      - docker_nat_p2p
      - docker_wasm_p2p
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A job skipped because an earlier tier failed reads as passing to branch protection; this
      # job does not: anything but success in any job above fails it.
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: v["result"] for job, v in json.loads(os.environ["RESULTS"]).items()}
          for job, result in sorted(results.items()):
              print(f"{result:>10}  {job}")
          bad = [job for job, result in results.items() if result != "success"]
          sys.exit(f"not every job succeeded: {', '.join(sorted(bad))}" if bad else 0)
          PY
