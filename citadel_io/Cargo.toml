[package]
name = "citadel_io"
version = "0.14.0"
authors = ["Thomas Braun <thomas.braun@avarok.net>"]
edition = "2021"
description = "Underlying runtime for interfacing with I/O for std/wasm targets"
homepage = "https://avarok.net/"
repository = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol"
workspace = ".."
readme = "../README.md"
categories = ["cryptography", "network-programming", "asynchronous"]
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["std"]
std = ["net"]
deadlock-detection = ["parking_lot/deadlock_detection"]
# Gates citadel_io's own socket helpers. tokio's `net` is listed with the native tokio below, not here:
# a feature naming `tokio/net` would also switch it on for wasm32-unknown-unknown, where tokio refuses
# to compile with it.
net = []
# Linux-only io_uring inbound-UDP backend. Off by default; the unsafe ring code lives here behind this
# feature. On non-Linux targets the deps resolve to nothing, so enabling it is a harmless no-op.
io-uring = ["dep:io-uring", "dep:libc"]

[dependencies]
citadel_io_macros = { workspace = true }
rand = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
url = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
    "time",
    "fs",
    "sync",
    "parking_lot",
    "net",
] }
tokio-util = { workspace = true, features = ["codec", "time", "io", "net"] }
tokio-stream = { workspace = true }
parking_lot = { workspace = true }

# io_uring backend deps live only on Linux (the io-uring crate does not build elsewhere). Optional and
# gated behind the `io-uring` feature, so a default build pulls in neither.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
# The same crates.io tokio as native, with the features tokio supports on wasm32-unknown-unknown
# (no `time`: its clock is `std::time::Instant`, which panics in the browser; timers go through
# `citadel_io::time`, backed by wasmtimer).
tokio = { workspace = true, features = ["macros", "sync", "rt", "io-util"] }
tokio-util = { workspace = true, features = ["codec", "io"] }
tokio-stream = { workspace = true }
wasmtimer = "0.4"
getrandom = { workspace = true, features = ["wasm_js"] }
serde = { workspace = true, default-features = false, features = [
    "derive",
    "std",
] }
