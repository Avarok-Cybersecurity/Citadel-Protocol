# This template contains all of the possible sections and their default values

# Note that all fields that take a lint level have these possible values:
# * deny - An error will be produced and the check will fail
# * warn - A warning will be produced, but the check will not fail
# * allow - No warning or error will be produced, though in some cases a note
# will be

# The values provided in this template are the default values that will be used
# when any section or field is not specified in your own configuration

# If 1 or more target triples (and optionally, target_features) are specified,
# only the specified targets will be checked when running `cargo deny check`.
# This means, if a particular package is only ever used as a target specific
# dependency, such as, for example, the `nix` crate only being used via the
# `target_family = "unix"` configuration, that only having windows targets in
# this list would mean the nix crate, as well as any of its exclusive
# dependencies not shared by any other crates, would be ignored, as the target
# list here is effectively saying which targets you are building for.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin" ,
    "x86_64-pc-windows-msvc",
    # The browser build.
    "wasm32-unknown-unknown",
]
# Every optional feature, so an advisory reached only through one (sql pulls sqlx-mysql and rsa)
# is still seen; cargo audit reads the whole lockfile and caught what this graph once missed.
all-features = true

# This section is considered when running `cargo deny check advisories`
# More documentation for the advisories section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
# The path where the advisory database is cloned/fetched into
# cargo-deny's own directory, one checkout per URL beneath it. It must not be cargo-audit's
# ~/.cargo/advisory-db: deny wrote its checkout inside that directory, and audit then refused to
# clone into a non-empty one (run 44415208817).
db-path = "~/.cargo/advisory-dbs"
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]

# The lint level for crates that have been yanked from their source registry
yanked = "warn"
# A list of advisory IDs to ignore. Note that ignored advisories will still
# output a note when they are encountered.
#
# This list is also cargo audit's: ci/cargo-audit.sh passes each id here to `cargo audit --ignore`,
# and refuses an entry without a reason. One list, so the two tools can never disagree on an
# exception.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "Bincode is unmaintained, with no known vulnerability; it is our serialization format, and it moves when a suitable replacement is identified." },
    { id = "RUSTSEC-2021-0127", reason = "serde_cbor is unmaintained, with no known vulnerability. Only `authenticator` (citadel_proto's opt-in `security-key` feature) uses it, to parse a security key's CTAP2 responses." },
    # Reviewed 2026-11-18; the owner chose to keep MySQL support and document this exception.
    { id = "RUSTSEC-2023-0071", reason = "Reviewed 2026-11-18. rsa 0.9 arrives only through citadel_user's opt-in `sql` feature (sqlx all-databases -> sqlx-mysql). sqlx-mysql 0.8.6 (src/connection/auth.rs, encrypt_rsa) parses the server's RSA public key and calls RsaPublicKey::encrypt with OAEP to send the password; it holds no private key and never decrypts or signs. The Marvin attack is a timing side channel in private-key operations, which this path never performs. Remove when sqlx moves to rsa 0.10." },
    { id = "RUSTSEC-2016-0007", reason = "Reviewed and accepted by the owner 2026-11-18. jwt is unmaintained, with no known vulnerability. It arrives only through citadel_user's opt-in `google-services` feature, which signs Firebase service tokens; no default build links it." },
    # Each entry below has no release that fits the dependency graph; the
    # reason says why the advisory does not reach what this workspace ships.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 arrives only through elliptic-curve 0.13 (^0.5) under voprf 0.5, the newest stable voprf. The OPRF uses the ristretto255 ciphersuite: its group arithmetic is curve25519-dalek, and the one elliptic-curve item it calls is ExpandMsgXmd, a digest construction with no crypto-bigint code. No crypto-bigint operation runs on a secret." },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils is archived, with no known vulnerability. It arrives through nix 0.26, which every webrtc-util release (0.8 under stun, 0.17 under webrtc-srtp) pins." },
    { id = "RUSTSEC-2026-0459", reason = "SQLite is fixed in libsqlite3-sys 0.39, which no sqlx release can link (0.8 needs ^0.30, 0.9 needs <0.38), and rusqlite must share sqlx's copy (one links = sqlite3). The flaw needs a database file and its -wal written by a less trusted party; the sql backend opens only the database its operator configures. Remove this when sqlx accepts libsqlite3-sys 0.39." },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, with no known vulnerability, and has no maintained release to move to. Replacing it (jiff or time) spans citadel_proto, citadel_user and sqlx's chrono feature and is its own change." },
]
# Threshold for security vulnerabilities, any vulnerability with a CVSS score
# lower than the range specified will be ignored. Note that ignored advisories
# will still output a note when they are encountered.
# * None - CVSS Score 0.0
# * Low - CVSS Score 0.1 - 3.9
# * Medium - CVSS Score 4.0 - 6.9
# * High - CVSS Score 7.0 - 8.9
# * Critical - CVSS Score 9.0 - 10.0
#severity-threshold =

# This section is considered when running `cargo deny check licenses`
# More documentation for the licenses section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
# [possible values: any SPDX 3.11 short identifier (+ optional exception)].
allow = [
    "MIT",
    "Apache-2.0",
    "Unlicense",
    "ISC",
    "CC0-1.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "OpenSSL",
    "Unicode-DFS-2016",
    "Unicode-3.0",
]
# The confidence threshold for detecting a license from license text.
# The higher the value, the more closely the license text must be to the
# canonical license text of a valid SPDX license file.
# [possible values: any between 0.0 and 1.0].
confidence-threshold = 0.8
# Allow 1 or more licenses on a per-crate basis, so that particular licenses
# aren't accepted for every possible crate as with the normal allow list
exceptions = [
    # we do not use synchronous processing, thus, do not use
    # attohttpc
    { allow = ["MPL-2.0"], name = "attohttpc", version = "*" },
    # this is for testing only, which is not part of the SDK
    { allow = ["MPL-2.0", "CDLA-Permissive-2.0"], name = "webpki-roots", version = "*" },
    # Accepted by the owner 2026-11-18. The same Mozilla root-certificate data as webpki-roots, under the same data license; reached
    # through quinn-proto -> rustls-platform-verifier on targets with no platform verifier.
    { allow = ["CDLA-Permissive-2.0"], name = "webpki-root-certs", version = "*" },
    # Accepted by the owner 2026-11-18. dirs-sys 0.4's helper, under the opt-in `opfs` feature (opfs -> dirs 5). MPL-2.0 is
    # file-level copyleft: used unmodified, it places nothing on this code.
    { allow = ["MPL-2.0"], name = "option-ext", version = "*" },
    # transitive via quinn-proto -> fastbloom. Zlib is a permissive, OSI-approved,
    # FSF-Free license (BSD-like: no attribution or copyleft obligations)
    { allow = ["Zlib"], name = "foldhash", version = "*" },
    # Mozilla's CTAP2 client and its run loop, behind citadel_proto's opt-in `security-key` feature.
    # MPL-2.0 is file-level copyleft: used unmodified, it places nothing on this code.
    { allow = ["MPL-2.0"], name = "authenticator", version = "*" },
    { allow = ["MPL-2.0"], name = "runloop", version = "*" },
]

# Some crates don't have (easily) machine readable licensing information,
# adding a clarification entry for it allows you to manually specify the
# licensing information
[[licenses.clarify]]
# The name of the crate the clarification applies to
name = "ring"
# The optional version constraint for the crate
version = "*"
# The SPDX expression for the license requirements of the crate
expression = "MIT AND ISC AND OpenSSL"
# One or more files in the crate's source used as the "source of truth" for
# the license expression. If the contents match, the clarification will be used
# when running the license check, otherwise the clarification will be ignored
# and the crate will be checked normally, which may produce warnings or errors
# depending on the rest of your configuration
license-files = [
    # Each entry is a crate relative path, and the (opaque) hash of its contents
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[licenses.private]
# If true, ignores workspace crates that aren't published, or are only
# published to private registries
ignore = false
# One or more private registries that you might publish crates to, if a crate
# is only published to private registries, and ignore is true, the crate will
# not have its license(s) checked
registries = [
    #"https://sekretz.com/registry
]

# This section is considered when running `cargo deny check bans`.
# More documentation about the 'bans' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "allow"
# The graph highlighting used when creating dotgraphs for crates
# with multiple versions
# * lowest-version - The path to the lowest versioned duplicate is highlighted
# * simplest-path - The path to the version with the fewest edges is highlighted
# * all - Both lowest-version and simplest-path are used
highlight = "all"
# List of crates that are allowed. Use with care!
allow = [
    #{ name = "ansi_term", version = "=0.11.0" },
]
# List of crates to deny
deny = [
    # Each entry the name of a crate and a version range. If version is
    # not specified, all versions will be matched.
    #{ name = "ansi_term", version = "=0.11.0" },
    #
    # Wrapper crates can optionally be specified to allow the crate when it
    # is a direct dependency of the otherwise banned crate
    #{ name = "ansi_term", version = "=0.11.0", wrappers = [] },
]
# Certain crates/versions that will be skipped when doing duplicate detection.
skip = [
    #{ name = "ansi_term", version = "=0.11.0" },
]
# Similarly to `skip` allows you to skip certain crates during duplicate
# detection. Unlike skip, it also includes the entire tree of transitive
# dependencies starting at the specified crate, up to a certain depth, which is
# by default infinite
skip-tree = [
    #{ name = "ansi_term", version = "=0.11.0", depth = 20 },
]

# This section is considered when running `cargo deny check sources`.
# More documentation about the 'sources' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
# Lint level for what to happen when a crate from a crate registry that is not
# in the allow list is encountered
unknown-registry = "deny"
# Lint level for what to happen when a crate from a git repository that is not
# in the allow list is encountered
unknown-git = "deny"
# List of URLs for allowed crate registries. Defaults to the crates.io index
# if not specified. If it is specified but empty, no registries are allowed.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# List of URLs for allowed Git repositories
# The quinn-proto backport fork (see `[patch.crates-io]` in Cargo.toml).
allow-git = ["https://github.com/Avarok-Cybersecurity/quinn"]

# No organisation-wide git allowance: each git source is named in allow-git above.
