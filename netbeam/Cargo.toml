[package]
name = "netbeam"
version = "0.14.0"
description = "a pure-rust asynchronous network synchronization crate (using tokio) that recreates familiar asynchronous paradigms but in a network context"
authors = ["Thomas Braun <thomas.braun@avarok.net>"]
edition = "2021"
workspace = ".."
homepage = "https://avarok.net/"
repository = "https://github.com/Avarok-Cybersecurity/Citadel-Protocol"
readme = "../README.md"
categories = ["cryptography", "network-programming", "asynchronous"]
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["std"]
std = ["rand/std", "rand/std_rng", "citadel_io/std", "anyhow/std"]

[dependencies]
citadel_io = { workspace = true }
futures = { workspace = true, features = ["std"] }
bytes = { workspace = true }
async-trait = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
rand = { workspace = true }
async-stream = { workspace = true }
sync_wrapper = { workspace = true }
log = { workspace = true }

# `rand 0.8` pulls getrandom 0.2, whose wasm32-unknown-unknown support is gated
# behind its "js" feature (the 0.3-series `getrandom_backend="wasm_js"` rustflag in
# .cargo/config.toml does not cover 0.2). Same idiom citadel_io uses for 0.3:
# declare the transitive dep here solely to enable the feature for wasm builds.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", default-features = false, features = ["js"] }

[dev-dependencies]
async-recursion = { workspace = true }
citadel_logging = { workspace = true }
rstest = { workspace = true }

[lib]
doctest = false
