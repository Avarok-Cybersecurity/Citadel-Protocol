codecov:
  notify:
    # One upload per coverage shard (.github/workflows/coverage.yml's matrix.shard). Codecov
    # waits for all of them before it reports, so a partial upload is never read as the total.
    after_n_builds: 3

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

coverage:
  range: "80..90"
  round: down
  precision: 4
  status:
    project:
      default:
        # basic
        target: 83%
        # advanced settings
        #if_ci_failed: error
        informational: false
        only_pulls: true